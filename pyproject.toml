[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neuroprobe"
version = "0.2.0"
authors = [
    {name = "Andrii Zahorodnii"},
    {name = "Christopher Wang"},
    {name = "Bennett Stankovits"},
    {name = "Charikleia Moraitaki"},
    {name = "Geeling Chau"},
    {name = "Andrei Barbu"},
    {name = "Boris Katz"},
    {name = "Ila R Fiete"},
]
description = "Neuroprobe: Benchmark for Evaluating iEEG Foundation Models. Evaluating intracranial brain responses to naturalistic stimuli."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

keywords = [
    "neuroscience",
    "brain",
    "neural-data", 
    "benchmark",
    "intracranial",
    "eeg",
    "ieeg",
    "seeg",
    "ecog",
    "foundation-models",
    "evaluation",
    "naturalistic-stimuli",
    "machine-learning",
    "pytorch",
]

dependencies = [
    "chz>=0.4.0",
    "numpy>=2.4.4",
    "pandas>=3.0.2",
    "torch>=2.11.0",
    "crane @ git+https://github.com/insight-neuro/crane",
    "scikit-learn>=1.8.0",
]

[dependency-groups]
dev = [
    "mypy>=1.20.2",
    "pytest>=9.0.3",
    "ruff>=0.15.12",
]

[project.urls]
Homepage = "https://neuroprobe.dev"
Repository = "https://github.com/insight-neuro/neuroprobe"
"Bug Reports" = "https://github.com/insight-neuro/neuroprobe/issues"

[tool.setuptools]
packages = ["neuroprobe"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]       # basics: style, flakes, isort, pyupgrade, bugbear
ignore = ["E501", "E402", "F722", "B905"] # let the formatter handle wrapping
